name: CI & Deploy

# Runs checks on every push/PR. On push to main, also deploys to the VPS:
# SSH in, fast-forward the repo, and rebuild the Docker stack.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      # deploy/Caddyfile drives the Caddy shared by every site on the VPS: a bad file takes them all down.
      - name: Caddyfile guard
        run: |
          for site in www.verbito.ai atlas.verbito.ai; do
            grep -qxF "$site {" deploy/Caddyfile || { echo "deploy/Caddyfile has no $site block" >&2; exit 1; }
          done
          docker run --rm -e DOMAIN=qulture.tech -e ACME_EMAIL=ci@example.com -v "$PWD/deploy:/etc/caddy:ro" \
            caddy:2.11.3-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  deploy:
    name: Deploy to VPS
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A rebuild on a new base image (build --pull) takes >10 min, the action's default; it timed out on
          # 2026-10-23 after the image built but before `up -d`, leaving the old containers running.
          command_timeout: 30m
          script: |
            set -e
            cd ~/qulture
            git fetch --all --prune
            # Gate the shared Caddy BEFORE the reset rewrites deploy/Caddyfile: the new file must keep the
            # Verbito-managed blocks and pass `caddy validate` in the running Caddy, or nothing changes.
            git show origin/main:deploy/Caddyfile > /tmp/Caddyfile.next
            for site in www.verbito.ai atlas.verbito.ai; do
              grep -qxF "$site {" /tmp/Caddyfile.next || { echo "deploy/Caddyfile has no $site block: not deploying" >&2; exit 1; }
            done
            if docker ps --format '{{.Names}}' | grep -qx qulture-caddy-1; then
              docker cp /tmp/Caddyfile.next qulture-caddy-1:/tmp/Caddyfile.next
              docker exec qulture-caddy-1 caddy validate --config /tmp/Caddyfile.next --adapter caddyfile
            fi
            git reset --hard origin/main
            # --pull: always rebuild on the current base image (security releases reuse the same tag)
            docker compose -f docker-compose.prod.yml --env-file .env build --pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
